# Model Assumptions
#
# Purpose:
# - Store scenario inputs (feed quality bins, plant throughput, etc.)
# - Store unit performance parameters (AD methane yield, biogas composition)
#
# Notes:
# - Sources are cited where possible; assumptions are marked and can be changed later

quality_bins:
  pelagic_high_quality:
    moisture_frac: 0.8673
    ash_wt_frac_dry: 0.3453
    vs_ts: 0.6550
    source:
      key: milledge2020
      note: "Energies 2020 paper (Turks and Caicos pelagic species averages), Table 1."

  beach_wrack_low_quality:
    moisture_frac: 0.8198
    ash_wt_frac_dry: 0.4694
    vs_ts: 0.5311
    source:
      key: milledge2020
      note: "Energies 2020 paper (Mixed Sargassum inundation), Table 1."

# Notes from the previous presentation
policies:
  solids_loading_target_ts_wt_frac: 0.15
  solids_loading_target_ts_wt_frac_max: 0.20
  freshwater_wash_allowed: false
  retain_salinity: true

scale:
  wet_feed_ton_per_day: 15000 # as discussed with Hauke
  ton_definition: metric

ad_feed:
  moisture_frac: 0.85
  source:
    key: assumed
    note: "Placeholder; update if/when AD feed dilution or dewatering basis is defined."

ad:
  # sizing and operating conditions
  hrt_days: 25
  slurry_density_kg_per_m3: 1000 # approximate density of water
  gas_storage_frac_of_total_volume: 0.25
  max_single_digester_volume_MG: 1.5

  # operating temperature
  temperature_K: 308.15  # 35°C (Mesophillic)

  # composition assumptions for raw biogas
  biogas:
    ch4_molfrac: 0.55
    co2_molfrac: 0.43
    h2s_molfrac: 0.02

  mixing_W_per_m3: 5.0
  influent_temperature_K: 298.15   # 25C baseline
  temperature_K: 308.15            # already have this (35C)
  cp_kJ_per_kgK: 4.18

  sources:
    hrt_days:
      key: nrel_adam_1994
      note: "Residence time guidance; used here as baseline"
    slurry_density:
      key: nrel_adam_1994
      note: "Example liquid feed density ~1000 kg/m3"
    gas_storage:
      key: psu_extension_ad_design
      note: "Temporary gas storage suggested ~10–20% of total digester volume"
    biogas_composition_example:
      key: nrel_adam_1994
      note: "Example medium-Btu biogas composition (~55% CH4, 43% CO2, 2% H2S)"
    ch4_range_check:
      key: epa_agstar_operator_guidebook
      note: "Typical CH4 in biogas commonly cited around 45–70%"
    temperature:
      key: assumed_mesophilic
      note: "Mesophilic AD commonly operated around ~35°C; baseline set to 35°C"

ad_performance:
  mode: biogas

  # biogas mol fraction
  ch4_molfrac: 0.5
  ch4_molfrac_source:
    key: eesi_biogas_factsheet
    note: "Biogas often ~50–70% methane"

  # untreated pelagic Sargassum methane yield
  # 77.64 mL CH4 / g VS -> 0.0555 kg CH4 / kg VS (STP conversion)
  ch4_kg_per_kg_vs: 0.0555
  ch4_yield_source:
    key: salgado_hernandez_2023
    note: "Reports methane production for untreated biomass"

  # digestate solids reduction
  vs_destruction: 0.50
  vs_destruction_source:
    key: assumed
    note: "Placeholder"

ad_costing:
  # anchor point from ADBC spreadsheet --> ADBC is a spreadsheet model developed by NREL for anaerobic digestion costing
  base_volume_m3: 2779.92
  base_capex_usd: 1796981.40
  maintenance_usd_per_m3_yr: 10.0
  source:
    key: adbc_spreadsheet
    file: "ADBCv2-48 (2).xlsm"
    sheet: "AnaerobicDigester"
    cells:
      base_volume_m3: "K8"
      base_capex_usd: "U33"
      maintenance_usd_per_m3_yr: "AB18"

biogas_upgrading:
  technology: membrane  # using membrane --> can switch to other technologies later

  ch4_recovery: 0.99
  co2_removal: 0.95

  # performance
  target_ch4_molfrac: 0.97
  methane_slip_frac: 0.01

  # utilities
  electricity_kWh_per_Nm3_raw: 0.25

  # costing
  capex_usd_per_Nm3ph_raw: 2200
  maintenance_frac_of_capex_per_yr: 0.035

  sources:
    electricity:
      citation: "IEA Bioenergy Task 37, Biomethane status and factors affecting market development (2014)"
      note: "Reports electricity consumption typically 0.2–0.3 kWh/Nm³ raw biogas for mature upgrading technologies (incl. membranes)."
    methane_slip:
      citation: "IEA Bioenergy Task 37, Biomethane status and factors affecting market development (2014)"
      note: "States manufacturers guarantee methane losses below ~0.5–2% for new plants."
    maintenance:
      citation: "IEA Bioenergy Task 37, Biomethane status and factors affecting market development (2014)"
      note: "Table lists annual maintenance cost for membranes at ~3–4% of investment cost."
    capex:
      citation: "IEA-ETSAP E-TechDS: Biogas and Bio-syngas Production (Dec 2013)"
      note: "Investment cost for biogas-to-biomethane upgrading units reported ~USD 1950–2600 per Nm³/h for larger raw gas capacities."

digestate_decanter_centrifuge:
  solids_IDs: ["Cellulose", "Ash"]  # currently only tracking these solids
  ts_capture_frac: 0.78
  cake_moisture_frac: 0.75
  capacity_tph_each: 50.0
  centrifuge_purchase_cost_usd_each: 297500.0 
  F_BM: 1.0

preprocessing:
    press:
      cake_solids_wt_frac: 0.35
      solids_capture_frac: 0.98
      solids_IDs:
      - Glucan
      - Xylan
      - Mannan
      - Galactan
      - Arabinan
      - Alginate
      - Fucoidan
      - Mannitol
      - Protein
      - OtherSolids
      - Lignin
      - Ash
      
      solubles_to_pressate_frac: 1.0

      # utilities
      power_kWh_per_dry_ton_TS: 5.0

      # costing
      capex_model: scaled_anchor
      basis: wet_tph               # wet tons per hour throughput basis
      ref_capacity_tph_wet: 50.0
      capex_installed_ref_usd: 5000000.0
      scale_exponent: 0.60 
      F_BM: 1.0  

      sources:
      capex:
        citation: "Engineering reports / municipal dewatering projects (order-of-magnitude installed cost anchor)"
        note: "Using installed CAPEX anchor per dewatering train + scaling. Replace with vendor quote or sector-specific TEA when available."
      power:
        citation: "Assumed baseline (temporary)"
        note: "Placeholder press electricity intensity on dry-solids basis; update with vendor/spec or wastewater ref when selected."

    mill:
      loss_frac: 0.15

      # utilities
      power_kWh_per_dry_ton_dry: 25.0

      # costing
      capex_model: inl_hammermill_anchor
      ref_capacity_dry_ton_per_hr: 10.0
      purchase_cost_ref_usd: 206400.0
      install_factor: 1.8
      scale_exponent: 0.6
      F_BM: 1.0

    sources:
      power:
        citation: "NREL, Fast Pyrolysis and Hydrotreating TEA (FY11 OSTI 46586)"
        url: "https://docs.nrel.gov/docs/fy11osti/46586.pdf"
        note: "NREL cites 50 kWh/ton as a common grinding assumption; baseline set to 25 with planned sensitivity (25–50)."
      capex:
        citation: "INL TEA table (hammer mill cost anchor)"
        url: "https://inldigitallibrary.inl.gov/sites/sti/sti/7323596.pdf"
        note: "Hammer mill purchase cost anchor $206,400 used for capacity scaling with exponent 0.6 and install factor."

digestate_screw_press:
  solids_IDs:
    - Glucan
    - Xylan
    - Mannan
    - Galactan
    - Arabinan
    - Alginate
    - Fucoidan
    - Mannitol
    - Protein
    - OtherSolids
    - Lignin
    - Ash
  ts_capture_frac: 0.4
  cake_moisture_frac: 0.5
  capacity_tph_each: 6.0
  kWh_per_m3: 0.67
  eur_to_usd: 1.19
  include_polymer_dosing: false
  polymer_dosing_cost_eur_each: 0.0
  F_BM: 1.0

vfa_ad:
  # sizing
  hrt_days: 15.0
  slurry_density_kg_per_m3: 1000.0
  gas_storage_frac_of_total_volume: 0.25
  max_single_digester_volume_MG: 1.5

  # utilities
  mixing_W_per_m3: 5.0
  influent_temperature_K: 298.15   # 25 C
  target_temperature_K: 308.15     # 35 C
  cp_kJ_per_kgK: 4.18

vfa_ad_performance:
  # conversion
  vs_destruction: 0.50
  vfa_kg_per_kg_vs_destroyed: 0.80
  vfa_recovery: 0.90

  # VFA composition
  vfa_split:
    AceticAcid: 0.25
    PropionicAcid: 0.05
    ButyricAcid: 0.45
    ValericAcid: 0.05
    HexanoicAcid: 0.20